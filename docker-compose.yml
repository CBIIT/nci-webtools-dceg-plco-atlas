version: "3"
services:
  backend:
    build:
      context: "."
      dockerfile: "./docker/backend.dockerfile"
    ports:
      - "9000:9000"
    env_file: 
      - server/.env

  frontend:
    build:
      context: "."
      dockerfile: "./docker/frontend.dockerfile"
      args:
        REACT_APP_VERSION: ${REACT_APP_VERSION:-docker}
        REACT_APP_DEPLOYMENT_DATE: ${REACT_APP_DEPLOYMENT_DATE:-Unknown}
    environment:
      API_BASE_URL: http://backend:9000
    links:
      - backend:backend
    ports:
      - "3000:80"
 